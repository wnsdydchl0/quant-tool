# 예시 포지션 (ORE portfolio.xml의 Bond 거래 대응). 쿠폰·만기는 예시 값이다.
# 원금은 쿠폰 레그 notionals(액면, USD), 매도 포지션은 payer: true (ORE: 승수 = bond_notional × (지급이면 −1)).
- id: UST_2Y
  trade_type: Bond
  bond_data:
    issuer_id: UST
    security_id: UST_2Y
    reference_curve_id: UST
    settlement_days: 1
    calendar: UnitedStates.GovernmentBond
    issue_date: 2026-09-30
    coupons:
      - leg_type: Fixed
        payer: false
        currency: USD
        notionals: [2.0e+07]
        day_counter: ActualActual.Bond
        payment_convention: Unadjusted
        fixed_leg_data: {rates: [0.035]}
        schedule_data:
          rules:
            - {start_date: 2026-09-30, end_date: 2028-09-30, tenor: 6M, calendar: UnitedStates.GovernmentBond,
               convention: Unadjusted, term_convention: Unadjusted, rule: Backward}
