# 시뮬레이션 시장 격자 (ORE simulation.xml Market 블록, ScenarioSimMarketParameters 대응).
# 격자점 하나가 RiskFactorKey(YieldCurve, UST, 만기 번호) 하나가 된다.
# spreaded 모드(sensitivity.yaml의 use_spreaded_term_structures)면 기준 상태에서 초기 커브와 같다.
base_currency: USD
currencies: []                 # discount_curve(통화)는 격자화하지 않고 초기 시장을 그대로 쓴다
yield_curves:
  names: [UST]
  tenors:
    "": [1M, 3M, 6M, 9M, 1Y, 18M, 2Y, 3Y, 4Y, 5Y, 6Y, 7Y, 8Y, 9Y, 10Y, 12Y, 15Y, 20Y, 25Y, 30Y]
  interpolation: LinearZero    # LinearZero | LogLinear (ORE SpreadedDiscountCurve와 같은 두 방식)
  extrapolation: FlatZero
  roll_down: ForwardForward    # 날짜 이동 시 오늘의 선도가 실현된다 (ORE 기본)
