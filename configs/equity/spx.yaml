# S&P 500 지수 (합성 샘플 시세로 시험). 할인은 UST 커브, 배당은 평탄 배당률.
name: SPX
calendar: UnitedStates.NYSE
day_count: Actual365Fixed
discount_curve: UST
spot_key: EQ/SPOT/SPX
dividend_key: EQ/DIVYIELD/SPX
dividend_tenors: [1Y, 2Y, 5Y]
vol:
  quote_key: EQ/VOL/SPX/{expiry}/{strike}
  expiries: [1M, 3M, 6M, 1Y, 2Y]
  strikes: [80, 90, 100, 110, 120]
heston:
  name: SPX_HESTON
  init: {v0: 0.04, kappa: 2.0, theta: 0.04, sigma: 0.5, rho: -0.6}
  recalibrate: true
  optimizer: {max_iterations: 500, stationary_iterations: 50,
              root_epsilon: 1.0e-8, function_epsilon: 1.0e-8, gradient_epsilon: 1.0e-8}
