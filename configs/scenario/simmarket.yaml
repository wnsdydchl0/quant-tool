# 시뮬레이션 시장 격자 (ORE simulation.xml, ScenarioSimMarketParameters 대응). 격자점이 RiskFactorKey가 된다.
# 격자점 사이는 제로금리 선형, 바깥은 평탄. spreaded: true면 격자 Quote가 초기 커브 대비 이동량이라
# 기준 상태에서 초기 커브와 같다. false(절대 모드)면 격자점 사이 보간 차이가 생긴다
# (ScenarioSimMarket.base_reconciliation, docs/architecture.md 2.1).
UST:
  kind: zero
  tenors: [1M, 3M, 6M, 9M, 1Y, 18M, 2Y, 3Y, 4Y, 5Y, 6Y, 7Y, 8Y, 9Y, 10Y, 12Y, 15Y, 20Y, 25Y, 30Y]
  interpolation: Linear(Zero)
  extrapolation: flat_zero
  spreaded: true
  roll_down: ForwardForward      # 날짜 이동 시 오늘의 선도가 실현된다 (ORE 기본)
